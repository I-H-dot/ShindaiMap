name: Update train timetables

on:
  schedule:
    # 09:15 JST on the first day of each month.
    - cron: "15 0 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: train-timetable-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Scrape train timetables
        run: python3 scraiping/trainScheduleGetter.py --output src/data/generated/trainTimetables.ts

      - name: Commit generated timetable data
        run: |
          if git diff --quiet -- src/data/generated/trainTimetables.ts; then
            echo "No timetable changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/generated/trainTimetables.ts
          git commit -m "Update train timetables"
          git push
